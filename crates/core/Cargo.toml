[package]
name = "doc-converter-core"
version.workspace = true
edition.workspace = true
description = "OOXML primitives: ZIP package access, streaming XML, and relationships"
license.workspace = true
# workspace-URL не совпадает с фактическим remote (meerrec/wasm-converter)
repository = "https://github.com/meerrec/wasm-converter"

[dependencies]
zip        = { workspace = true }
quick-xml  = { workspace = true }
serde      = { workspace = true }
thiserror  = { workspace = true }
miette     = { workspace = true }
chrono     = { workspace = true }
smallvec   = { workspace = true }

# proptest тянет rand → getrandom, который не собирается под wasm32 без
# `getrandom_backend="wasm_js"`; эти dev-зависимости нужны только нативным тестам.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest   = { workspace = true }
insta      = { workspace = true }
serde_json = { workspace = true }
