[package]
name = "doc-converter-docx-wasm"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
# На crates.io не публикуется: крейт — только сборочный вход wasm-pack для
# npm-пакета @doc-converter/wasm-docx (scripts/build-wasm.sh). В npm уезжают
# биндинги, а не крейт, поэтому состав релиза — шесть крейтов (план спринта 12,
# S4.3); менялся бы он только вместе с ROADMAP и DoD.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doc-converter-docx = { workspace = true }
doc-converter-render = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# rustc эмитит bulk-memory, а bundled wasm-opt в wasm-pack его не понимает.
# Оптимизацию делает scripts/build-wasm.sh системным wasm-opt, если он есть.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
