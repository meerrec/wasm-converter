[package]
name = "doc-converter-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doc-converter-core = { path = "../core" }
doc-converter-docx = { path = "../docx" }
doc-converter-pptx = { path = "../pptx" }
doc-converter-xlsx = { path = "../xlsx" }
# Мусорные байты подставляются в часть валидного пакета DOCX, для чего цели
# собирают ZIP в памяти. Записи кладутся `Stored`, но deflate-бэкенд включён: он
# же включён у `doc-converter-core` (zip 9, flate2 на miniz_oxide), и раскладка
# фич не должна зависеть от цели.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Отдельный workspace: nightly и sanitizer не должны попадать в сборку
# монорепозитория (в корневом Cargo.toml крейт в `exclude`).
[workspace]

[[bin]]
name = "core_zip"
path = "fuzz_targets/core_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_xml_reader"
path = "fuzz_targets/core_xml_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_rels"
path = "fuzz_targets/core_rels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_worksheet"
path = "fuzz_targets/xlsx_worksheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_document"
path = "fuzz_targets/docx_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_numbering"
path = "fuzz_targets/docx_numbering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_rels"
path = "fuzz_targets/docx_rels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_styles"
path = "fuzz_targets/docx_styles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pptx_presentation"
path = "fuzz_targets/pptx_presentation.rs"
test = false
doc = false
bench = false
