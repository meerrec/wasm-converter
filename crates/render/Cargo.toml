[package]
name = "doc-converter-render"
version.workspace = true
edition = "2021"
description = "DisplayList, OffscreenCanvas painter, geometry, and text metrics for OOXML viewers"
license = "Apache-2.0"
repository = "https://github.com/meerrec/wasm-converter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { workspace = true }
thiserror = { workspace = true }
lru = { workspace = true }
skrifa = { workspace = true }
# ZipLimits в сигнатуре `FormatPlugin::parse` (ADR-0030): render — общая
# граница форматов, core лежит ниже неё, цикл зависимостей невозможен.
doc-converter-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "OffscreenCanvasRenderingContext2d",
  "OffscreenCanvas",
  "ImageBitmap",
  "TextMetrics",
] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "render"
harness = false
