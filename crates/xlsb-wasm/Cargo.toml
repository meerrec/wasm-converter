[package]
name = "doc-converter-xlsb-wasm"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
# На crates.io не публикуется: крейт — только сборочный вход wasm-pack для
# npm-пакета @meerrec/wasm-xlsb (scripts/build-wasm.sh). В npm уезжают
# биндинги, а не крейт — как у docx-wasm.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doc-converter-core        = { workspace = true }
doc-converter-xlsb        = { workspace = true }
# Кадр рисует общий `doc_converter_xlsx::paint`: XLSB доводится до той же
# модели книги, поэтому рендер и геометрия листов не дублируются.
doc-converter-xlsx        = { workspace = true }
doc-converter-render      = { workspace = true }
doc-converter-wasm-common = { workspace = true }
wasm-bindgen              = "0.2"
js-sys                    = "0.3"
serde                     = { version = "1", features = ["derive"] }
serde-wasm-bindgen        = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# rustc эмитит bulk-memory, а bundled wasm-opt в wasm-pack его не понимает.
# Оптимизацию делает scripts/build-wasm.sh системным wasm-opt, если он есть.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
