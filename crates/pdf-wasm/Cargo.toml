[package]
name = "doc-converter-pdf-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doc-converter-pdf = { workspace = true }
doc-converter-xlsx = { workspace = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# rustc эмитит bulk-memory, а bundled wasm-opt в wasm-pack его не понимает.
# Оптимизацию делает scripts/build-wasm.sh системным wasm-opt, если он есть.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
