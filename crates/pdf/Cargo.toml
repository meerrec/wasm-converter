[package]
name = "doc-converter-pdf"
version.workspace = true
edition.workspace = true
description = "PDF export for XLSX sheets, DOCX documents and PPTX slides"
license.workspace = true
# workspace-URL не совпадает с фактическим remote (meerrec/wasm-converter)
repository = "https://github.com/meerrec/wasm-converter"

[dependencies]
doc-converter-core   = { workspace = true }
doc-converter-render = { workspace = true }
doc-converter-docx   = { workspace = true }
doc-converter-xlsx   = { workspace = true }
doc-converter-pptx   = { workspace = true }
serde                = { workspace = true }
# Модель значений lopdf (`Object`, `Dictionary`, `Stream`) — опора своего
# PDF-бэкенда (ADR-0022). default-фичи сняты (`chrono-clock`, `rayon` прод-пути
# не нужны), парсер с 0.36 собирается безусловно (фичи `nom_parser` больше
# нет), хотя чужой ввод мы не разбираем. RUSTSEC-2026-0187 закрыт в 0.42,
# поэтому ignore из deny.toml снят. `wasm_js` нужен нерандому `getrandom`
# (зависимость lopdf) для сборки `pdf-wasm` под wasm32-unknown-unknown; на
# нативных таргетах фича инертна.
lopdf                = { version = "0.45", default-features = false, features = ["wasm_js"] }
# Декодирование медиачастей PNG/JPEG своего бэкенда (ADR-0022): фичи
# `png`/`jpeg` задаёт workspace-зависимость. Прочие форматы не включаем —
# декодеры это вес wasm, а вставки редки.
image                = { workspace = true }
# Подрезка TTF по использованным символам для встраивания в PDF (ADR-0022);
# 0.2.6 уже в Lockfile — вторая копия в дерево не заводится.
subsetter            = "0.2"
# Метрики глифов для `W`-массива и `FontDescriptor` — тот же `skrifa`, что
# у `render` (ADR-0002/0005).
skrifa               = { workspace = true }
thiserror            = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Сквозные тесты собирают книги XLSX в памяти, как это делает Excel: фикстур
# с `_xlnm.Print_Titles` в `test-fixtures/xlsx` нет, а счёт фикстур закреплён
# документацией (как у `docx`-тестов).
zip       = { workspace = true }

[[bench]]
name = "pdf"
harness = false
