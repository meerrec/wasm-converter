[package]
name = "doc-converter-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
doc-converter-core   = { workspace = true }
doc-converter-render = { workspace = true }
serde                = { workspace = true }
quick-xml            = { workspace = true }
thiserror            = { workspace = true }
miette               = { workspace = true }
tracing              = { workspace = true }

[dev-dependencies]
# Сквозные тесты собирают пакеты в памяти, как это делает Word.
zip        = { workspace = true }
serde_json = { workspace = true }
criterion  = { workspace = true }

[[bench]]
name = "open"
harness = false

# proptest тянет rand → getrandom, который не собирается под wasm32 без
# `getrandom_backend="wasm_js"`; эти dev-зависимости нужны только нативным тестам.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
insta    = { workspace = true }
proptest = { workspace = true }
