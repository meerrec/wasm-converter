[package]
name = "doc-converter-docx"
version.workspace = true
edition.workspace = true
description = "WordprocessingML (DOCX) parsing, document model, and pagination"
license.workspace = true
# workspace-URL не совпадает с фактическим remote (meerrec/wasm-converter)
repository = "https://github.com/meerrec/wasm-converter"

[dependencies]
doc-converter-core   = { workspace = true }
doc-converter-render = { workspace = true }
serde                = { workspace = true }
quick-xml            = { workspace = true }
thiserror            = { workspace = true }
miette               = { workspace = true }
tracing              = { workspace = true }
unicode-bidi         = { workspace = true }
# Обёртки над core::xml возвращают SmallVec (как и сам core).
smallvec             = { workspace = true }

[dev-dependencies]
# Сквозные тесты собирают пакеты в памяти, как это делает Word.
zip        = { workspace = true }
serde_json = { workspace = true }
criterion  = { workspace = true }

[[bench]]
name = "open"
harness = false

[[bench]]
name = "pagination"
harness = false

# proptest тянет rand → getrandom, который не собирается под wasm32 без
# `getrandom_backend="wasm_js"`; эти dev-зависимости нужны только нативным тестам.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
insta    = { workspace = true }
proptest = { workspace = true }
