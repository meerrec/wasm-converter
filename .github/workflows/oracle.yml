# Эталонный оракул: наш PDF-экспорт против PDF от LibreOffice. Две джобы, по
# одной на формат: постраничный SSIM листа XLSX (scripts/oracle-ssim.sh) и
# число страниц со SSIM первой страницы документа DOCX
# (scripts/oracle-docx-pages.sh). Отдельный workflow, а не джоба ci.yml: нужен
# LibreOffice с шрифтами, прогон длинный, и красный оракул не должен блокировать
# правки, не касающиеся рендера.
#
# Джобы независимы намеренно: раскладка DOCX правится своей волной, и её красный
# отчёт не должен ни гасить XLSX-джобу, ни выглядеть как поломка книги. Обе
# запускаются на общем наборе путей (`paths` ниже) — разделять их по путям
# пришлось бы двумя workflow, а `test-fixtures/**` и `crates/pdf/**` общие для
# обоих форматов.
#
# Ночной запуск сдвинут с :00 — расписание GitHub на круглый час попадает в пик
# нагрузки и стартует с задержкой.
name: Oracle (LibreOffice SSIM)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'scripts/oracle-ssim.sh'
      - 'scripts/oracle-docx-pages.sh'
      - 'scripts/oracle-pptx.sh'
      - 'scripts/gen-fixtures.ts'
      - 'scripts/generate_docx_fixtures.ts'
      - 'scripts/generate_pptx_fixtures.ts'
      - 'test-fixtures/**'
      - '.github/workflows/oracle.yml'
      - 'crates/pdf/**'
      - 'crates/xlsx/**'
      - 'crates/docx/**'
      - 'crates/pptx/**'
      - 'crates/pptx-layout/**'
      - 'crates/pptx-pdf/**'

jobs:
  ssim:
    name: LibreOffice SSIM
    runs-on: ubuntu-latest
    # Бумага задана документом: `<pageSetup paperSize="9">` (A4 по ECMA-376)
    # дописывает в фикстуры scripts/gen-fixtures.ts — только этот рычаг и
    # работает. Окруженческие рычаги опровергнуты прогонами: локаль
    # LANG/LC_ALL=ru_RU.UTF-8 (37538750822), /etc/papersize=a4 (37560908632) и
    # метрическая локаль в профиле LibreOffice (37574459266) — каждый оставил
    # Letter. Локаль ru_RU.UTF-8 нужна здесь только ради локализованного
    # форматирования дат в эталоне.
    # Следствие для разбора: систематически низкий SSIM на formats-date-ru —
    # первая гипотеза — русские названия месяцев в эталоне (наш рендер
    # форматирует по кодам формата из книги), а не ошибка рендера.
    env:
      LANG: ru_RU.UTF-8
      LC_ALL: ru_RU.UTF-8
    steps:
      - uses: actions/checkout@v4

      # LANG=ru_RU.UTF-8 без генерации — несуществующая локаль: в образе
      # раннера её надо создать. `locale -a` печатает имя как `ru_RU.utf8`,
      # поэтому шаблон — начало строки; под `bash -e` (шелл шагов Actions)
      # несовпадение уронит шаг, и это то, что нужно.
      - name: locale ru_RU.UTF-8
        run: |
          sudo locale-gen ru_RU.UTF-8
          locale -a | grep -q '^ru_RU'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          # Свой ключ: кэш mem_probe не должен зависеть от сборок других джоб.
          shared-key: rust-oracle

      # fonts-crosextra-carlito — метрически совместимая замена Calibri: в
      # фикстурах разметка задана под неё, а без замены LibreOffice подставит
      # первый попавшийся шрифт и разъедется по метрикам сразу во всех книгах —
      # SSIM упадёт систематически, и различить это от ошибок рендера будет
      # нельзя.
      # ffmpeg — источник SSIM: у imagemagick из 24.04 типа метрики SSIM нет
      # вовсе, а `-metric SSIM` седьмой версии печатает distortion (SSIM =
      # 1 − 2·distortion), то есть не то число, которое нужно отчёту.
      # ImageMagick остаётся для размеров страниц и обрезки.
      - name: system tools
        uses: ./.github/actions/apt-install
        with:
          packages: libreoffice-calc fonts-crosextra-carlito poppler-utils ffmpeg imagemagick unzip

      - name: build mem_probe
        run: cargo build --release -p doc-converter-pdf --example mem_probe

      # Фикстуры для оракула берутся из git (test-fixtures/xlsx): тяжёлые книги
      # из `pnpm gen:fixtures` нужны бенчу и замеру памяти, а не эталонному
      # сравнению, поэтому node/pnpm здесь не ставится.
      - name: compare with LibreOffice
        run: bash scripts/oracle-ssim.sh target/release/examples/mem_probe test-fixtures/xlsx oracle-out

      # Strict-подмножество (ADR-0034): тот же прогон по purl-фикстурам из
      # test-fixtures/xlsx/strict; LibreOffice читает оба варианта. Фикстуры
      # перечислены явно: у strict-подмножества свой состав, и молчаливый
      # отбор по умолчанию сравнил бы только пересечение с ним. Отдельный
      # workdir, чтобы отчёты не смешивались.
      - name: compare Strict with LibreOffice
        run: bash scripts/oracle-ssim.sh target/release/examples/mem_probe test-fixtures/xlsx/strict oracle-out-strict values-integers.xlsx styles-bold-italic.xlsx charts-five-kinds.xlsx images-png.xlsx

      # Отчёт нужен и после падения прогона: по нему видно, что именно разъехалось.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-report
          path: oracle-out/report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-strict-report
          path: oracle-out-strict/report.md

  docx:
    name: LibreOffice DOCX pages + SSIM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          # Свой ключ: кэш docx_export не должен зависеть от сборок других джоб
          # (та же причина, что у rust-oracle выше).
          shared-key: rust-oracle-docx

      # libreoffice-writer — конвертер DOCX в PDF: в образе раннера LibreOffice
      # ставится пакетами по приложениям, и одной calc для Writer-фильтра мало
      # (соседняя джоба ставит calc — он ей; пересечение по core безвредно).
      # fonts-crosextra-carlito — метрически совместимая замена Calibri: в
      # фикстурах разметка задана под неё, а без замены LibreOffice подставит
      # первый попавшийся шрифт и разъедется по метрикам сразу во всех
      # документах — SSIM упал бы систематически.
      # pdfinfo идёт в poppler-utils (число страниц эталона), ffmpeg — SSIM,
      # ImageMagick — размеры страниц и обрезка.
      - name: system tools
        uses: ./.github/actions/apt-install
        with:
          packages: libreoffice-writer fonts-crosextra-carlito poppler-utils ffmpeg imagemagick

      - name: build docx_export
        run: cargo build --release -p doc-converter-pdf --example docx_export

      # Локаль не задаётся: она нужна была XLSX-джобе ради локализованных дат в
      # эталоне, а в DOCX даты приходят из документа. Фикстуры — из git
      # (`test-fixtures/docx`); прогон по всему дереву, ~100 документов.
      - name: compare with LibreOffice
        run: bash scripts/oracle-docx-pages.sh target/release/examples/docx_export test-fixtures/docx oracle-out-docx

      # Strict-подмножество (ADR-0034): тот же прогон по purl-фикстурам из
      # test-fixtures/docx/strict; эталоном остаётся LibreOffice, читающий оба
      # варианта. Отдельный workdir, чтобы отчёты не смешивались.
      - name: compare Strict with LibreOffice
        run: bash scripts/oracle-docx-pages.sh target/release/examples/docx_export test-fixtures/docx/strict oracle-out-docx-strict

      # Отчёт нужен и после падения прогона: по нему видно, что именно разъехалось.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-docx-report
          path: oracle-out-docx/report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-docx-strict-report
          path: oracle-out-docx-strict/report.md
  pptx:
    name: LibreOffice Impress SSIM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-oracle

      - name: system tools
        uses: ./.github/actions/apt-install
        with:
          packages: libreoffice-impress fonts-crosextra-carlito poppler-utils ffmpeg imagemagick unzip

      - name: build export example
        run: cargo build --release -p doc-converter-pptx-pdf --example export

      - name: compare with LibreOffice
        run: bash scripts/oracle-pptx.sh target/release/examples/export test-fixtures/pptx oracle-out-pptx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-pptx-report
          path: oracle-out-pptx
          if-no-files-found: ignore
