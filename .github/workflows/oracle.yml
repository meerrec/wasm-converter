# Эталонный оракул: наш PDF-экспорт XLSX против PDF от LibreOffice, постраничный
# SSIM (scripts/oracle-ssim.sh). Отдельный workflow, а не джоба ci.yml: нужен
# LibreOffice с шрифтами, прогон длинный, и красный оракул не должен блокировать
# правки, не касающиеся рендера листа.
#
# Ночной запуск сдвинут с :00 — расписание GitHub на круглый час попадает в пик
# нагрузки и стартует с задержкой.
name: Oracle (LibreOffice SSIM)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'scripts/oracle-ssim.sh'
      - 'scripts/gen-fixtures.ts'
      - 'test-fixtures/**'
      - '.github/workflows/oracle.yml'
      - 'crates/pdf/**'
      - 'crates/xlsx/**'

jobs:
  ssim:
    name: LibreOffice SSIM
    runs-on: ubuntu-latest
    # Бумага задана документом: `<pageSetup paperSize="9">` (A4 по ECMA-376)
    # дописывает в фикстуры scripts/gen-fixtures.ts — только этот рычаг и
    # работает. Окруженческие рычаги опровергнуты прогонами: локаль
    # LANG/LC_ALL=ru_RU.UTF-8 (37538750822), /etc/papersize=a4 (37560908632) и
    # метрическая локаль в профиле LibreOffice (37574459266) — каждый оставил
    # Letter. Локаль ru_RU.UTF-8 нужна здесь только ради локализованного
    # форматирования дат в эталоне.
    # Следствие для разбора: систематически низкий SSIM на formats-date-ru —
    # первая гипотеза — русские названия месяцев в эталоне (наш рендер
    # форматирует по кодам формата из книги), а не ошибка рендера.
    env:
      LANG: ru_RU.UTF-8
      LC_ALL: ru_RU.UTF-8
    steps:
      - uses: actions/checkout@v4

      # LANG=ru_RU.UTF-8 без генерации — несуществующая локаль: в образе
      # раннера её надо создать. `locale -a` печатает имя как `ru_RU.utf8`,
      # поэтому шаблон — начало строки; под `bash -e` (шелл шагов Actions)
      # несовпадение уронит шаг, и это то, что нужно.
      - name: locale ru_RU.UTF-8
        run: |
          sudo locale-gen ru_RU.UTF-8
          locale -a | grep -q '^ru_RU'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          # Свой ключ: кэш mem_probe не должен зависеть от сборок других джоб.
          shared-key: rust-oracle

      # fonts-crosextra-carlito — метрически совместимая замена Calibri: в
      # фикстурах разметка задана под неё, а без замены LibreOffice подставит
      # первый попавшийся шрифт и разъедется по метрикам сразу во всех книгах —
      # SSIM упадёт систематически, и различить это от ошибок рендера будет
      # нельзя.
      # ffmpeg — источник SSIM: у imagemagick из 24.04 типа метрики SSIM нет
      # вовсе, а `-metric SSIM` седьмой версии печатает distortion (SSIM =
      # 1 − 2·distortion), то есть не то число, которое нужно отчёту.
      # ImageMagick остаётся для размеров страниц и обрезки.
      - name: system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc fonts-crosextra-carlito poppler-utils ffmpeg imagemagick unzip

      - name: build mem_probe
        run: cargo build --release -p doc-converter-pdf --example mem_probe

      # Фикстуры для оракула берутся из git (test-fixtures/xlsx): тяжёлые книги
      # из `pnpm gen:fixtures` нужны бенчу и замеру памяти, а не эталонному
      # сравнению, поэтому node/pnpm здесь не ставится.
      - name: compare with LibreOffice
        run: bash scripts/oracle-ssim.sh target/release/examples/mem_probe test-fixtures/xlsx oracle-out

      # Отчёт нужен и после падения прогона: по нему видно, что именно разъехалось.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-report
          path: oracle-out/report.md
