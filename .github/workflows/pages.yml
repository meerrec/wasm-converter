name: Pages

on:
  push: { branches: [main] }
  workflow_dispatch:

# Дефолтных прав мало: деплой Pages требует pages: write и id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

# Деплои Pages не параллелятся: незавершённый деплой не отменяем,
# иначе сайт останется в состоянии предыдущей (уже устаревшей) публикации.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Артефакты x2t (packages/x2t/vendor) лежат в Git LFS: без их выкачки
      # демо в /viewer/ увезёт в dist пойнтеры (~130 Б), и страница конвертера
      # молча потеряет работоспособность.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-pack

      - run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # pkg/ всех трёх wasm-модулей генерируется wasm-pack; в репозитории его нет.
      - run: bash scripts/build-wasm.sh

      # Пакеты собираются по одному и вручную: пример импортирует core и
      # browser-convert из dist/, которого в репозитории нет, — Vite резолвит
      # их оттуда.
      - run: pnpm -F @meerrec/core build

      - run: pnpm -F @meerrec/browser-convert... build

      # Клиент Embed API, которым демо загружает self-host движка Euro-Office:
      # его exports смотрят в dist/.
      - run: pnpm -F @meerrec/eurooffice build

      # Тарболы частей движка (~290 МиБ) и зеркало каталога шрифтов кэшируются
      # в build/eurooffice/.cache. Восстановление экономит десятки минут и
      # снимает нагрузку с GitHub API: у раннера лимит 60 запросов в час на IP,
      # а зеркало ходит в API за списком файлов. Ключ — только хеш assemble.mjs,
      # без restore-keys: скрипт и есть описание того, что лежит в кэше, так что
      # частично устаревший кэш тут опаснее промаха. Сохранение каталога делает
      # сам actions/cache в конце джобы — отдельного шага save не нужно.
      - uses: actions/cache@v4
        with:
          path: build/eurooffice/.cache
          key: eurooffice-parts-${{ hashFiles('scripts/eurooffice/assemble.mjs') }}

      # Сайт движка собирается в build/eurooffice/site. Режим `copy` (а не
      # дефолтный brotli) обязателен: GitHub Pages не отдаёт Content-Encoding: br,
      # поэтому под именем x2t.wasm.br в артефакт должны уехать несжатые байты;
      # к тому же сжатие в CI — это 2–4 потерянные минуты.
      - run: EUROOFFICE_X2T_BR=copy node scripts/eurooffice/assemble.mjs

      # Демо переехало в подкаталог /viewer/: корень сайта теперь занимает
      # движок. Turborepo здесь не используется намеренно — в strict-режиме он
      # не пробрасывает незадекларированные env-переменные, а VITE_BASE как раз
      # такая. Страницы демо: `/#/docx` («Слово»), `/#/xlsx` («ДваИксель»),
      # `/#/convert` («Конвертер»); корень демо ведёт на `/#/docx`.
      - run: pnpm -F @meerrec/example-viewer build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/viewer/

      # Компоновка публикуемого каталога: `.pages/` — двухуровневый сайт, в
      # корне движок Euro-Office, в /viewer/ — демо. Скрипт же чистит вендорный
      # лендинг, кладёт x2t.wasm.br plain-байтами (см. режим `copy` выше) и
      # прогоняет гейты артефакта — бывшие шаги «check x2t assets» и «check coi
      # service worker» живут теперь здесь, чтобы публикуемое проверял ровно тот
      # код, что его и собирает.
      #
      # Обход COOP/COEP на Pages — наш корневой sw.js (scripts/pages/): он сам
      # ставит заголовки изоляции навигациям, им же подменена вендорная заглушка
      # движка — две регистрации в одном корневом scope вытесняли бы друг друга.
      # С заголовками поднимается SharedArrayBuffer и транспорт `sab`.
      # Без них вьюер не ломается: автовыбор уходит в first-class путь `bytes`
      # (ADR-0021), проверено дым-прогоном S2.3 (docs/sprint-12/demo.md).
      - run: node scripts/pages/stage.mjs --out .pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
