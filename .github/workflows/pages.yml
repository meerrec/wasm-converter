name: Pages

on:
  push: { branches: [main] }
  workflow_dispatch:

# Дефолтных прав мало: деплой Pages требует pages: write и id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

# Деплои Pages не параллелятся: незавершённый деплой не отменяем,
# иначе сайт останется в состоянии предыдущей (уже устаревшей) публикации.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build example
    runs-on: ubuntu-latest
    # Vite читает базовый путь из VITE_BASE: на Pages сайт живёт
    # в /<имя-репозитория>/, а не в корне домена.
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-pack

      - run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # pkg/ всех трёх wasm-модулей генерируется wasm-pack; в репозитории его нет.
      - run: bash scripts/build-wasm.sh

      # Core собирается первым: пример импортирует его из dist/.
      # Turborepo здесь не используется намеренно — в strict-режиме он не
      # пробрасывает незадекларированные env-переменные, а VITE_BASE как раз такая.
      - run: pnpm -F @doc-converter/core build

      # Пример один — объединённый просмотрщик, и публикуется он целиком, как
      # есть: XLSX в отдельном DOCX-подкаталоге держать больше не нужно. Сайт
      # живёт по адресу из README (`/<имя-репозитория>/`), а обе страницы —
      # `/#/docx` («Слово») и `/#/xlsx` («ДваИксель»); корень ведёт на `/#/docx`.
      - run: pnpm -F @doc-converter/example-viewer build

      # Обход COOP/COEP на Pages — это service worker, который отдаёт заголовки
      # сам; с ним поднимается SharedArrayBuffer и транспорт `sab`. Без него
      # вьюер не ломается: автовыбор уходит в first-class путь `bytes`
      # (ADR-0021), проверено дым-прогоном S2.3 (docs/sprint-12/demo.md).
      # Публикуется результат сборки, так что проверяем его здесь, а не
      # после деплоя.
      - name: check coi service worker
        run: |
          set -euo pipefail
          f=examples/viewer/dist/coi-serviceworker.js
          [ -s "$f" ] || { echo "::error::$f не попал в публикуемый каталог"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/viewer/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
