name: Pages

on:
  push: { branches: [main] }
  workflow_dispatch:

# Дефолтных прав мало: деплой Pages требует pages: write и id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

# Деплои Pages не параллелятся: незавершённый деплой не отменяем,
# иначе сайт останется в состоянии предыдущей (уже устаревшей) публикации.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-pack

      - run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # pkg/ всех трёх wasm-модулей генерируется wasm-pack; в репозитории его нет.
      - run: bash scripts/build-wasm.sh

      # Пакеты собираются по одному и вручную: пример импортирует core из
      # dist/, которого в репозитории нет, — Vite резолвит его оттуда.
      - run: pnpm -F @meerrec/core build

      # Turborepo здесь не используется намеренно — в strict-режиме он
      # не пробрасывает незадекларированные env-переменные, а VITE_BASE как раз
      # такая. Страницы демо: `/#/docx` («Слово»), `/#/xlsx` («ДваИксель»);
      # корень демо ведёт на `/#/docx`.
      - run: pnpm -F @meerrec/example-viewer build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/viewer/

      # Компоновка публикуемого каталога: демо — в /viewer/, корневой sw.js —
      # в корне (только корневая область видит навигации /viewer/ и ставит им
      # заголовки изоляции). Обход COOP/COEP на Pages — этот самый sw.js
      # (scripts/pages/): он сам ставит заголовки изоляции навигациям.
      # С заголовками поднимается SharedArrayBuffer и транспорт `sab`.
      # Без них вьюер не ломается: автовыбор уходит в first-class путь `bytes`
      # (ADR-0021), проверено дым-прогоном S2.3 (docs/sprint-12/demo.md).
      - run: |
          mkdir -p .pages/viewer
          cp -R examples/viewer/dist/. .pages/viewer/
          cp scripts/pages/sw.js .pages/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
