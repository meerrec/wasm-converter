name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.target }}

      - name: fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Генератор wire-типов и пример под фичей `ts` не входят в общий clippy
      # (у него нет `--all-features`), поэтому проверяются отдельно.
      - name: clippy (wire)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy -p doc-converter-core --features ts --all-targets -- -D warnings

      # Доккомментарии крейтов — часть публичного API, а `cargo doc` до этого
      # не гонялся нигде: битая intra-doc ссылка на приватный элемент жила
      # месяцами (в этом классе ошибались уже трижды).
      - name: doc
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # PDF-тесты сверяют вывод системными утилитами; только на x86_64,
      # в wasm32-ноге матрицы тесты не гоняются.
      - name: pdf tooling
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/apt-install
        with:
          packages: qpdf poppler-utils

      - name: test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --all-features

      # Wire-типы Rust → TS генерируются из одного источника (ADR-0028).
      # Перегенерация обязана дать побайтово тот же файл: ручная правка или
      # забытая регенерация после изменения Rust падает на diff'е.
      - name: wire drift
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo run -p doc-converter-core --features ts --example export_wire
          git diff --exit-code -- packages/core/src/generated/wire.ts

      - name: build (wasm)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build --target wasm32-unknown-unknown -p doc-converter-wasm -p doc-converter-pdf-wasm -p doc-converter-docx-wasm -p doc-converter-pptx-wasm -p doc-converter-pptx-pdf-wasm -p doc-converter-wasm-common -p doc-converter-xlsb-wasm -p doc-converter-ods-wasm -p doc-converter-odt-wasm -p doc-converter-odp-wasm --release

      # На нативном таргете все десять крейтов пусты (`#![cfg(target_arch = "wasm32")]`),
      # поэтому их доккомментарии проверяет только эта нога матрицы.
      - name: doc (wasm)
        if: matrix.target == 'wasm32-unknown-unknown'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --target wasm32-unknown-unknown -p doc-converter-wasm -p doc-converter-pdf-wasm -p doc-converter-docx-wasm -p doc-converter-pptx-wasm -p doc-converter-pptx-pdf-wasm -p doc-converter-wasm-common -p doc-converter-xlsb-wasm -p doc-converter-ods-wasm -p doc-converter-odt-wasm -p doc-converter-odp-wasm --no-deps

  wasm:
    name: Wasm bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-pack

      - run: cargo install wasm-pack --locked
      - run: bash scripts/build-wasm.sh

      # Экспорты всех восьми ленивых модулей сверяются с их крейтами (у основного
      # `wasm` проверка своя, ниже): wasm-bindgen собирает #[wasm_bindgen] из всего
      # графа зависимостей, лишнее имя — регрессия.
      - name: check wasm exports
        run: |
          set -euo pipefail

          # $1 — сгенерированный .d.ts, $2 — каталог src его крейта.
          check_exports() {
            local dts=$1 crate_src=$2

            expected=$(grep -rhA1 '^#\[wasm_bindgen\]' "$crate_src" --include='*.rs' \
              | grep -oE 'pub fn [a-z_][a-z0-9_]*' | awk '{print $3}' | sort -u || true)
            [ -n "$expected" ] || { echo "::error::в $crate_src не найдено #[wasm_bindgen] pub fn"; exit 1; }

            # initSync — служебный конструктор wasm-bindgen, не экспорт крейта.
            actual=$(grep -oE '^export function [A-Za-z_][A-Za-z0-9_]*' "$dts" \
              | awk '{print $3}' | grep -vx initSync | sort -u || true)
            [ -n "$actual" ] || { echo "::error::в $dts нет объявленных export function"; exit 1; }

            unexpected=$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))
            missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))

            if [ -n "$unexpected" ] || [ -n "$missing" ]; then
              echo "::error::$dts разошёлся с экспортами $crate_src"
              [ -z "$unexpected" ] || printf 'лишние экспорты в .d.ts:\n%s\n' "$unexpected"
              [ -z "$missing" ] || printf 'нет экспортов крейта:\n%s\n' "$missing"
              exit 1
            fi
            echo "OK: экспорты $dts совпадают с $crate_src"
          }

          check_exports packages/wasm-pdf/pkg/doc_converter_pdf_wasm.d.ts crates/pdf-wasm/src
          check_exports packages/wasm-docx/pkg/doc_converter_docx_wasm.d.ts crates/docx-wasm/src
          check_exports packages/wasm-pptx/pkg/doc_converter_pptx_wasm.d.ts crates/pptx-wasm/src
          check_exports packages/wasm-pptx-pdf/pkg/doc_converter_pptx_pdf_wasm.d.ts crates/pptx-pdf-wasm/src
          check_exports packages/wasm-xlsb/pkg/doc_converter_xlsb_wasm.d.ts crates/xlsb-wasm/src
          check_exports packages/wasm-ods/pkg/doc_converter_ods_wasm.d.ts crates/ods-wasm/src
          check_exports packages/wasm-odt/pkg/doc_converter_odt_wasm.d.ts crates/odt-wasm/src
          check_exports packages/wasm-odp/pkg/doc_converter_odp_wasm.d.ts crates/odp-wasm/src

      # Просмотрщик DOCX уехал из основного модуля в ленивый `wasm-docx`;
      # экспорты `docx_*` в `packages/wasm/pkg` означают его возврат в основной
      # бандл — регрессию бюджета `wasm (viewer)`. То же про PPTX: его
      # просмотрщик живёт в ленивом `wasm-pptx`.
      - name: check viewer module has no lazy-format exports
        run: |
          set -euo pipefail
          if grep -rq 'docx_' packages/wasm/pkg/*.d.ts; then
            echo "::error::packages/wasm/pkg/*.d.ts экспортирует docx_*:" \
              "просмотрщик DOCX грузится лениво отдельным модулем wasm-docx," \
              "его возврат в основной модуль — регрессия бюджета wasm (viewer)"
            exit 1
          fi
          if grep -rq 'pptx_' packages/wasm/pkg/*.d.ts; then
            echo "::error::packages/wasm/pkg/*.d.ts экспортирует pptx_*:" \
              "просмотрщик PPTX живёт в отдельном воркере и ленивом модуле wasm-pptx," \
              "его возврат в основной модуль — регрессия бюджета wasm (viewer)"
            exit 1
          fi
          echo "OK: в основном модуле нет экспортов docx_*/pptx_*"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pdf-pkg
          path: packages/wasm-pdf/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-docx-pkg
          path: packages/wasm-docx/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pptx-pkg
          path: packages/wasm-pptx/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pptx-pdf-pkg
          path: packages/wasm-pptx-pdf/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-xlsb-pkg
          path: packages/wasm-xlsb/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-ods-pkg
          path: packages/wasm-ods/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-odt-pkg
          path: packages/wasm-odt/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-odp-pkg
          path: packages/wasm-odp/pkg

  # Браузерные wasm-bindgen-тесты до этой джобы не запускались нигде: в
  # crates/wasm/tests/ живёт регрессия кэша стилей painter'а, тесты остальных
  # wasm-крейтов — в их собственных `tests/`, а CLAUDE.md требует покрывать
  # новые wasm-функции через `wasm-bindgen-test`.
  #
  # `needs` нет намеренно: `wasm-pack test` собирает тестовые артефакты из
  # исходников и `pkg/` из джобы wasm ему не нужен, так что джоба идёт
  # параллельно и критический путь не удлиняет.
  wasm-test:
    name: Wasm browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-test

      # ChromeDriver ищет браузер по именам (`chrome`, потом `google-chrome`)
      # сначала в /usr/local/sbin, /usr/local/bin, /usr/sbin, /usr/bin, /sbin,
      # /bin и /opt/google/chrome — и только потом в PATH (chrome_finder.cc:
      # GetApplicationDirs + GetPathsFromEnvironment). То есть на раннере
      # выигрывает предустановленный Chrome образа, поэтому драйвер берём ровно
      # под него: скачанный wasm-pack'ом «самый свежий» уже разъезжался с
      # браузером (локально — 155 при Chrome 154).
      # Драйвер качаем из бакета Chrome for Testing напрямую: у setup-chrome свой
      # список «known good versions», который отстаёт от stable-канала образа, —
      # на 154.0.8037.97 он падал «Version ... not found». Точной версии в
      # бакете нет — падаем громко: подстановка `stable` вернула бы ровно тот
      # баг, от которого уходим.
      - name: chromedriver for the runner's chrome
        run: |
          set -uo pipefail
          version=$(google-chrome --version | awk '{print $NF}' || true)
          if [ -z "$version" ]; then
            echo "::error::google-chrome не найден на раннере — драйвер не подобрать"
            exit 1
          fi
          url="https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chromedriver-linux64.zip"
          if ! curl --fail --silent --show-error --location --output "$RUNNER_TEMP/chromedriver.zip" "$url"; then
            echo "::error::для Chrome ${version} нет chromedriver в бакете CfT: ${url}"
            exit 1
          fi
          unzip -q -o "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP/chromedriver"
          sudo install -m 0755 "$RUNNER_TEMP/chromedriver/chromedriver-linux64/chromedriver" /usr/local/bin/chromedriver
          chromedriver --version

      - run: cargo install wasm-pack --locked

      # wasm-pack берёт chromedriver из PATH, если он там есть, и качает свой
      # только при его отсутствии — на PATH (/usr/local/bin) его кладёт шаг выше.
      # Профиль release обязателен для всех шагов: бюджет ROADMAP §9 написан
      # для поставляемой сборки, её и надо мерить. Какой профиль быстрее на
      # `painter_perf`, по прогонам в CI сказать нельзя — наблюдённые 32 мс у
      # debug против 82 и 138 мс у release шли с разбросом раннера ~×1.7
      # (два последних — на одном и том же бинарнике), а он больше разницы
      # профилей. Гейт в нём мягкий и заведомо выше
      # того, что даёт программный рендер раннера: жёсткие 16 мс мерили бы
      # среду, а не сборку, — бюджет ROADMAP §9 (кадр 1200×800 за < 16 мс)
      # остаётся целью для живой машины.
      - name: wasm-pack test
        run: wasm-pack test --headless --chrome --release crates/wasm

      # Тесты моста DOCX переехали в отдельный крейт `crates/docx-wasm`.
      - name: wasm-pack test (docx)
        run: wasm-pack test --headless --chrome --release crates/docx-wasm

      # Тесты экспортёров в PDF живут в отдельном крейте `crates/pdf-wasm` и до
      # этого шага в CI не запускались.
      - name: wasm-pack test (pdf)
        run: wasm-pack test --headless --chrome --release crates/pdf-wasm

      # Тесты моста PPTX живут в отдельном крейте `crates/pptx-wasm`.
      - name: wasm-pack test (pptx)
        run: wasm-pack test --headless --chrome --release crates/pptx-wasm

      # Тесты экспортёра PPTX в PDF — в отдельном крейте `crates/pptx-pdf-wasm`.
      - name: wasm-pack test (pptx-pdf)
        run: wasm-pack test --headless --chrome --release crates/pptx-pdf-wasm

  js:
    name: JS (node ${{ matrix.node }})
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # @meerrec/core типизируется против сгенерированных wasm-bindgen
      # деклараций, поэтому pkg/ приезжает артефактом из джобы wasm.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      # pkg/ всех ленивых модулей приезжает артефактами, потому что
      # генерируется wasm-bindgen.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pdf-pkg
          path: packages/wasm-pdf/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-docx-pkg
          path: packages/wasm-docx/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pptx-pkg
          path: packages/wasm-pptx/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pptx-pdf-pkg
          path: packages/wasm-pptx-pdf/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-xlsb-pkg
          path: packages/wasm-xlsb/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-ods-pkg
          path: packages/wasm-ods/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-odt-pkg
          path: packages/wasm-odt/pkg

      - uses: actions/download-artifact@v4
        with:
          name: wasm-odp-pkg
          path: packages/wasm-odp/pkg

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # Сквозные тесты примеров идут в настоящем браузере: без него они падают
      # не от ошибки в коде, а от отсутствия браузера. Ставится на обе ноги
      # матрицы — `turbo run test` запускает их при любой версии Node.
      # Ставим из одного пакета: браузеры ложатся в общий кэш
      # (`~/.cache/ms-playwright`), откуда их берёт любой пакет workspace'а, — а
      # `turbo run test` гоняет `test` всякого пакета, у которого он есть.
      # Второй `--filter` в ту же команду добавлять нельзя: pnpm запускает
      # фильтры параллельно, и два `playwright install --with-deps` дерутся за
      # лок apt (`/var/lib/apt/lists/lock`) — один падает с exit 100 каждую
      # попытку. Если в workspace появится второй пакет со своим playwright,
      # установку придётся развести на два последовательных шага.
      # Повторы из-за фоновой установки пакетов в образе: `--with-deps` зовёт
      # apt-get и падает на «Could not get lock /var/lib/apt/lists/lock», пока
      # лок держит чужой процесс. Исчерпание попыток валит шаг ненулевым кодом.
      # Предел на попытку — как у apt-шагов (`.github/actions/apt-install`):
      # заминка неизвестной природы не должна ждаться бесконечно (в прогоне
      # 38161310682 apt-шаг провисел полчаса). 300 с — пятикратный запас к самой
      # долгой здоровой установке (62 с): здесь не только apt, но и скачивание
      # трёх браузеров, а оно сетевое и переменчивое. `timeout` шлёт TERM всей
      # группе процесса, так что оборванная попытка не оставляет за собой
      # apt-get; код 124 обычный `until` считает провалом и уходит на повтор.
      - name: playwright browsers
        run: |
          set -uo pipefail
          attempt=1
          until timeout 300 pnpm --filter @meerrec/example-viewer exec playwright install --with-deps chromium firefox webkit; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::playwright install не удался за ${attempt} попытки — браузеры не поставлены"
              exit 1
            fi
            echo "::warning::попытка ${attempt} упала (вероятно, лок apt-get) — повтор через 30 с"
            attempt=$((attempt + 1))
            sleep 30
          done

      - run: pnpm turbo run typecheck test build
      # Гейт: регрессия бюджета блокирует merge (ROADMAP §9). Строка про wasm
      # просмотрщика в `.size-limit.mjs` держит ленивость PDF: если модуль
      # экспорта вернётся в основной бандл, бюджет покраснеет. Так же держится
      # и ленивость DOCX: просмотрщик уехал в отдельный модуль, и его возврат в
      # основной бандл поймает та же строка бюджета.
      - if: matrix.node == 20
        run: pnpm size-limit

  # Числа DoD спринта 7 (время и память PDF-экспорта) держались на локальных
  # прогонах: ни `cargo bench`, ни замер памяти не запускались в CI. Память
  # гейтится жёстко (scripts/check-pdf-memory.sh: предел 40 МиБ, локальный
  # замер на 500-страничной фикстуре — 29,4 МиБ), время — мягко: число всегда
  # в логе, превышение даёт warning, а не красный CI (раннеры шумные;
  # в Спринте 6 жёсткие 300 мс уже меняли на мягкие 900).
  perf:
    name: PDF budgets (DoD 1, 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-perf

      # Метрику DoD 8 (ru_maxrss процесса) снимает системный time(1): на
      # macOS это `-l`, на Linux — GNU `-v`. В ubuntu-образе раннера GNU time
      # может отсутствовать.
      - name: time tooling
        uses: ./.github/actions/apt-install
        with:
          packages: time

      # Бенчи не должны сгнивать: компилируем все бенчи workspace, не запуская.
      - name: bench compile
        run: cargo bench --workspace --no-run

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Тяжёлой фикстуры (target/fixtures) в git нет: её пишет тот же
      # генератор, что и остальные фикстуры, — отсюда её берут бенч и mem_probe.
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - run: pnpm gen:fixtures

      - name: build mem_probe
        run: cargo build --release -p doc-converter-pdf --example mem_probe

      # Жёсткий абсолютный бюджет DoD 8: полный путь (`export_xlsx_sheet`,
      # PDF целиком в `Vec`) на 500-страничной книге ≤ 40 МиБ.
      - name: DoD 8 memory gate
        run: bash scripts/check-pdf-memory.sh target/release/examples/mem_probe target/fixtures/scale-500-pages.xlsx

      # Мягкий гейт DoD 1 (500 страниц < 3000 мс): бенч печатает медиану
      # пяти прогонов, она уходит в лог всегда; превышение — warning, не красный.
      - name: DoD 1 time (soft)
        run: |
          set -uo pipefail
          log=$(mktemp)
          status=0
          cargo bench -p doc-converter-pdf --bench pdf -- bench_pdf_time_500_pages 2>&1 | tee "$log" || status=$?
          median=$(grep -oE 'медиана экспорта [0-9]+' "$log" | grep -oE '[0-9]+' | tail -1 || true)
          if [ -z "$median" ]; then
            echo "::error::бенч не напечатал медиану экспорта — строка формата изменилась"
            exit 1
          fi
          echo "DoD 1: медиана экспорта — ${median} мс (мягкий порог 3000 мс)"
          if [ "$median" -gt 3000 ]; then
            echo "::warning::медиана ${median} мс выше порога DoD 1 (3000 мс)"
          fi
          exit "$status"

  # Бюджеты DoD спринта 8 и ROADMAP §9 для DOCX: `openDocx` на 50 МБ (native)
  # быстрее 1,5 с и пиковая память разбора ≤ 200 МиБ. Как и в PDF-джобе, память
  # гейтится жёстко, время — мягко (число всегда в логе, превышение даёт warning:
  # раннеры шумные, а бенч в CI делит ядро с параллельными джобами).
  #
  # Гейт памяти стоит на `memory_50mib.docx` (57,2 МиБ, 6000 абзацев, 75
  # изображений): на ней пик разбора — 156,8 МиБ, то есть бюджет 200 МиБ
  # измеряется с запасом и запас показывает распаковку картинок, ради которой
  # бюджет и назван «DOCX с изображениями». На плотном профиле ROADMAP
  # (`profile_50mib.docx`, 100 000 абзацев тела) тот же замер даёт 874,6 МиБ: те
  # же 200 МиБ там недостижимы без потокового разбора. Это зафиксированное
  # отклонение и задел Спринта 9, а не регрессия, поэтому профиль едет ниже
  # информационным прогоном — гейта на нём нет намеренно, а не забыт.
  perf-docx:
    name: DOCX budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-perf-docx

      # Метрику пика памяти (ru_maxrss процесса) снимает системный time(1):
      # на macOS это `-l`, на Linux — GNU `-v`. В ubuntu-образе раннера GNU
      # time может отсутствовать.
      - name: time tooling
        uses: ./.github/actions/apt-install
        with:
          packages: time

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Тяжёлых фикстур (target/fixtures/docx-large) в git нет: их пишет тот же
      # генератор, что и остальные фикстуры, — отсюда их берут mem_probe_docx,
      # гейт памяти и бенч.
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - run: pnpm gen:docx-fixtures:large

      # Сборка адресная, а не `--workspace`: она не тянет за собой чужие
      # таргеты, а джобе нужен ровно один пример.
      - name: build mem_probe_docx
        run: cargo build --release -p doc-converter-docx --example mem_probe_docx

      # Жёсткий бюджет DoD: пик RSS полного разбора 50-МиБ DOCX с картинками
      # ≤ 200 МиБ. Предел дублирует дефолт скрипта — чтобы бюджет был виден
      # в самой джобе, а не только внутри scripts/check-docx-memory.sh.
      - name: DoD 6 memory gate
        run: bash scripts/check-docx-memory.sh target/release/examples/mem_probe_docx target/fixtures/docx-large/memory_50mib.docx 200

      # Мягкий бюджет ROADMAP §9 (отдельный пункт DoD спринта 8, не шестой:
      # шестой — про память выше): медиана разбора профиля 50 МиБ < 1500 мс.
      # Шаблон грепа — вся строка целиком: в «медиана разбора [0-9]+» попадает
      # «50» из «50 МиБ», и гейт молча мерил бы 50 мс (предупреждение об этом
      # стоит в crates/docx/benches/open.rs). Фильтр criterion берёт только
      # группу 50 МиБ, но настройку остальных групп бенч всё равно выполняет —
      # поэтому фикстуры выше генерируются до бенча, а не только для mem_probe_docx.
      - name: ROADMAP §9 time (soft)
        run: |
          set -uo pipefail
          log=$(mktemp)
          status=0
          cargo bench -p doc-converter-docx --bench open -- bench_open_docx_50mib 2>&1 | tee "$log" || status=$?
          median=$(grep -oE 'медиана разбора 50 МиБ: [0-9]+' "$log" | grep -oE '[0-9]+' | tail -1 || true)
          if [ -z "$median" ]; then
            echo "::error::бенч не напечатал медиану разбора — строка формата изменилась"
            exit 1
          fi
          echo "ROADMAP §9: медиана разбора — ${median} мс (мягкий порог 1500 мс)"
          if [ "$median" -gt 1500 ]; then
            echo "::warning::медиана ${median} мс выше бюджета ROADMAP §9 (1500 мс)"
          fi
          exit "$status"

      # Информационно, без гейта: на плотном профиле видно абзацы/таблицы/
      # изображения и время, но пик RSS здесь 874,6 МиБ против бюджета 200 МиБ
      # (см. шапку джобы и docs/sprint-8/memory-report.md) — красный шаг на этом
      # числе был бы ложной тревогой.
      - name: profile 50 MiB (info)
        run: target/release/examples/mem_probe_docx --open-only target/fixtures/docx-large/profile_50mib.docx

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - run: cargo install cargo-deny --locked && cargo deny check
      - run: cargo install cargo-audit --locked && cargo audit
      # Версию pnpm action берёт из `packageManager` в package.json; ключ
      # `version` рядом с ним — ошибка «Multiple versions of pnpm specified».
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - run: pnpm audit --audit-level=high || true

  # Покрытие строк — пороги ROADMAP §9 (DoD спринта 8): ≥ 85 % для
  # `crates/docx` и ≥ 80 % для нового кода `crates/core`. Оба гейта жёсткие:
  # локальный замер после добора слайсов E2a–E2c — 92,75 % и 97,68 % по
  # строкам, запас есть, а числа покрытия, в отличие от времён и памяти,
  # детерминированы (один и тот же набор тестов даёт один и тот же процент) —
  # красный шаг здесь означает регрессию, а не шум раннера.
  #
  # Каждый крейт мерится отдельным прогоном: порог привязан к крейту, а общий
  # прогон двух сюит смешал бы числа — docx-тесты исполняют часть `crates/core`
  # и поднимают его (в замере E1 — с 97,68 % до 98,63 %).
  #
  # Вне гейта осознанно, а не по недосмотру: `crates/fuzz` — отдельный
  # workspace (nightly + санитайзер), не библиотечный код и в ROADMAP §9 не
  # адресуется; `crates/wasm` целиком под
  # `#![cfg(target_arch = "wasm32")]` — на нативном таргете пуст; у
  # `crates/render`, `xlsx`, `pdf` порога в ROADMAP §9 нет. Доктесты не
  # гоняются: `--doctests` в cargo-llvm-cov помечен unstable.
  coverage:
    name: Coverage (docx ≥ 85%, core ≥ 80%)
    runs-on: ubuntu-latest
    # Инструментированная сборка двух крейтов и 334 теста — холодный прогон
    # ≈40 с локально (M3 Pro, прогретый `~/.cargo`), на 2–4-vCPU раннере в
    # несколько раз дольше; плюс сюда же `cargo install cargo-llvm-cov`. 40
    # минут — с запасом на порядок, а не впритык.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # `llvm-tools-preview` (llvm-profdata/llvm-cov) — требование
      # cargo-llvm-cov. Компонент продублирован в `rust-toolchain.toml` для
      # локальных прогонов: в CI rustup идёт от `RUSTUP_TOOLCHAIN`, который
      # выставил action, и файл проекта не читает.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      # Свой shared-key: rust-cache кэширует инструментированный `target/`
      # этой джобы отдельно от обычных сборок.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-coverage

      - run: cargo install cargo-llvm-cov --locked

      # Каталог сборки отдельно не задаём: в cargo-llvm-cov 0.9.1 нет опции
      # `--target-dir`, а на своём раннере дефолтный `target/` ни с кем не
      # делится. Локально каталог задаётся через CARGO_TARGET_DIR.
      - name: core ≥ 80% lines
        run: cargo llvm-cov -p doc-converter-core --fail-under-lines 80

      - name: docx ≥ 85% lines
        run: cargo llvm-cov -p doc-converter-docx --fail-under-lines 85
