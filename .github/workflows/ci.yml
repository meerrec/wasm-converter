name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.target }}

      - name: fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # PDF-тесты сверяют вывод системными утилитами; только на x86_64,
      # в wasm32-ноге матрицы тесты не гоняются.
      - name: pdf tooling
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils

      - name: test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --all-features

      # Форк исключён из workspace (см. `exclude` в корневом Cargo.toml), и
      # `cargo test --workspace` его тесты не видит — без отдельного шага они
      # снова сгниют. Дефолтные фичи выключены намеренно: они тянут `html`
      # через resvg, а тот идёт под MPL-2.0, которую `deny.toml` не разрешает.
      # Проверяем ровно ту конфигурацию, которую собирает workspace
      # (`default-features = false`), иначе CI зеленел бы на том, чего мы не поставляем.
      - name: test (printpdf fork)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: vendor/printpdf
        run: cargo test --no-default-features

      - name: build (wasm)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build --target wasm32-unknown-unknown -p doc-converter-wasm -p doc-converter-pdf-wasm --release

  wasm:
    name: Wasm bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-pack

      - run: cargo install wasm-pack --locked
      - run: bash scripts/build-wasm.sh

      # I3: .d.ts не должен объявлять экспорты, которых нет в крейте.
      # wasm-bindgen собирает `#[wasm_bindgen]`-элементы из всего графа
      # зависимостей; wasm-API printpdf закрыт гейтом в форке
      # (vendor/printpdf/src/wasm/mod.rs, фича js-sys), поэтому любое
      # постороннее имя здесь — регрессия.
      - name: check wasm exports
        run: |
          set -euo pipefail
          dts=packages/wasm-pdf/pkg/doc_converter_pdf_wasm.d.ts

          expected=$(grep -rhA1 '^#\[wasm_bindgen\]' crates/pdf-wasm/src --include='*.rs' \
            | grep -oE 'pub fn [a-z_][a-z0-9_]*' | awk '{print $3}' | sort -u || true)
          [ -n "$expected" ] || { echo "::error::в crates/pdf-wasm не найдено #[wasm_bindgen] pub fn"; exit 1; }

          # initSync — служебный конструктор wasm-bindgen, не экспорт крейта.
          actual=$(grep -oE '^export function [A-Za-z_][A-Za-z0-9_]*' "$dts" \
            | awk '{print $3}' | grep -vx initSync | sort -u || true)
          [ -n "$actual" ] || { echo "::error::в $dts нет объявленных export function"; exit 1; }

          unexpected=$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))

          if [ -n "$unexpected" ] || [ -n "$missing" ]; then
            echo "::error::$dts разошёлся с экспортами crates/pdf-wasm"
            [ -z "$unexpected" ] || printf 'лишние экспорты в .d.ts:\n%s\n' "$unexpected"
            [ -z "$missing" ] || printf 'нет экспортов крейта:\n%s\n' "$missing"
            exit 1
          fi
          echo "OK: экспорты .d.ts совпадают с crates/pdf-wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pdf-pkg
          path: packages/wasm-pdf/pkg

  js:
    name: JS (node ${{ matrix.node }})
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # @doc-converter/core типизируется против сгенерированных wasm-bindgen
      # деклараций, поэтому pkg/ приезжает артефактом из джобы wasm.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      # pkg/ обоих модулей приезжает артефактами, потому что генерируется
      # wasm-bindgen.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pdf-pkg
          path: packages/wasm-pdf/pkg

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # Сквозные тесты примера идут в настоящем браузере: без него они падают
      # не от ошибки в коде, а от отсутствия браузера. Ставится на обе ноги
      # матрицы — `turbo run test` запускает их при любой версии Node.
      - run: pnpm --filter @doc-converter/example-viewer-xlsx exec playwright install --with-deps chromium firefox webkit

      - run: pnpm turbo run typecheck test build
      # Гейт: регрессия бюджета блокирует merge (ROADMAP §9). Строка про wasm
      # просмотрщика в `.size-limit.mjs` держит ленивость PDF: если модуль
      # экспорта вернётся в основной бандл, бюджет покраснеет.
      - if: matrix.node == 20
        run: pnpm size-limit

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.0 }
      - run: cargo install cargo-deny --locked && cargo deny check
      # Версию pnpm action берёт из `packageManager` в package.json; ключ
      # `version` рядом с ним — ошибка «Multiple versions of pnpm specified».
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - run: pnpm audit --audit-level=high || true
