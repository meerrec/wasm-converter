name: Release

# Релизная механика (план спринта 12, слайс S2.2). Два режима:
#
# 1. `dry-run` — на push в main и на PR проверяет, что проект по-прежнему
#    умеет выпускаться: changesets дают валидный план, wasm-модули и
#    npm-пакеты собираются, все шесть крейтов пакуются и проходят
#    `cargo publish --dry-run`. Это гейт DoD «cargo publish --dry-run зелёный».
#
# 2. `publish` — по тегу v* (или вручную из main) реально публикует
#    npm-пакеты: npmjs.org — основной реестр (ADR-0027), GitHub Packages —
#    зеркало; crates.io — по выключателю `PUBLISH_CRATES_IO`. В конце режется
#    GitHub Release. Тег ставится на main (trunk-based): с другой ветки джоба
#    молча пропускается.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    name: Release dry-run
    # На теге джобу не гоняем: тег — событие публикации, его ведёт джоба publish.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: PR-режим гейта гоняет `changeset status --since=origin/main`,
          # а на мелком клоне (дефолт fetch-depth: 1) merge-base с базой не находится —
          # обе стороны истории обрезаны. Дозагрузка origin/main в шаге гейта не спасает:
          # в мелком репозитории она приезжает такой же мелкой. Как в джобе publish.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          # wasm32-таргет нужен `cargo publish --dry-run --target` для
          # doc-converter-wasm: крейт целиком под
          # `#![cfg(target_arch = "wasm32")]`, на нативном таргете его
          # верификация собрала бы пустышку.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release-dry-run

      - run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # Гейт changesets. Статус печатает план релиза и падает, если
      # npm-пакеты изменились, а релизного changeset нет — та же семантика,
      # что у бота changesets. BaseBranch (main) диффуется через bare-имя,
      # но в PR-чекауте оно не резолвится (git merge-base не делает DWIM на
      # refs/remotes/origin/*), поэтому базу подтягиваем явно; полноту истории
      # для merge-base даёт fetch-depth: 0 в checkout выше.
      - name: changeset status
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # На main дифф с main пуст — шаг работает как показ накопленного
            # плана: что именно уедет в npm при следующем теге.
            pnpm changeset status
          else
            # На PR — гейт: пакеты менялись, а changeset не добавлен → красный.
            pnpm changeset status --since=origin/main
          fi

      # pkg/ трёх wasm-модулей генерируется здесь, из чистого дерева:
      # локальные pkg/ в git не живут, поэтому публикация обязана уметь
      # их собрать сама (риск S2.2 из плана спринта).
      - run: pnpm build:wasm

      # Сборка публикуемых пакетов: dist/ у core и cli, wasm-биндинги уже
      # в pkg/ из шага выше. Фильтр — только packages/*: приватный пример
      # для релиза не нужен.
      - run: pnpm turbo run build --filter='./packages/*'

      # Preflight упаковки npm: шаги ниже проверяют крейты, а npm-пакеты
      # доходили до реальной публикации непроверенными — и первый же релиз
      # выяснил, что wasm-пакет уезжает без бинарника (wasm-pack кладёт в pkg/
      # .gitignore со `*`, npm его учитывает и выбрасывает содержимое pkg/).
      # `npm pack --dry-run` ничего не публикует, не требует авторизации и не
      # пишет тарбол — только печатает список файлов, который здесь и сверяем.
      - name: npm pack preflight (десять пакетов)
        run: |
          set -euo pipefail
          for pkg in wasm wasm-docx wasm-pdf wasm-pptx wasm-pptx-pdf core cli react vue svelte; do
            files=$(cd "packages/$pkg" && npm pack --dry-run --json 2>/dev/null \
              | jq -r 'if type == "array" then .[0].files else .files end | .[].path')
            case "$pkg" in
              wasm|wasm-docx|wasm-pdf|wasm-pptx|wasm-pptx-pdf)
                printf '%s\n' "$files" | grep -qE '^pkg/[^/]+\.js$' \
                  || { echo "::error::@meerrec/$pkg: в тарболе нет pkg/*.js (содержимое pkg/ выпало целиком)"; printf '%s\n' "$files"; exit 1; }
                printf '%s\n' "$files" | grep -qE '^pkg/[^/]+\.wasm$' \
                  || { echo "::error::@meerrec/$pkg: в тарболе нет pkg/*.wasm — пакет уехал бы без бинарника"; printf '%s\n' "$files"; exit 1; }
                ;;
              *)
                printf '%s\n' "$files" | grep -qE '^dist/' \
                  || { echo "::error::@meerrec/$pkg: в тарболе нет dist/ — пакет уехал бы без сборки"; printf '%s\n' "$files"; exit 1; }
                ;;
            esac
            # Текст лицензии и README обязаны быть в каждом тарболе: без них
            # пакет в реестре нарушает Apache-2.0 и остаётся без инструкции
            # по установке. npm кладёт оба файла и сам, но `files[]` в
            # package.json перечисляет их явно — проверяем фактический состав.
            printf '%s\n' "$files" | grep -qx 'LICENSE' \
              || { echo "::error::@meerrec/$pkg: в тарболе нет LICENSE"; printf '%s\n' "$files"; exit 1; }
            printf '%s\n' "$files" | grep -qx 'README.md' \
              || { echo "::error::@meerrec/$pkg: в тарболе нет README.md"; printf '%s\n' "$files"; exit 1; }
            echo "OK: @meerrec/$pkg — файлов в тарболе: $(printf '%s\n' "$files" | grep -c .)"
          done

      # Упаковка без верификации сборкой. Здесь проверяем то, что недоступно
      # остальному CI: полноту файлов .crate, версионированные зависимости,
      # метаданные манифеста. Сборку кода проверяет ci.yml, а сборку именно
      # упакованного крейта — `publish --dry-run` ниже.
      - name: cargo package (шесть крейтов, по зависимостям)
        run: |
          set -euo pipefail
          # Порядок — строго по графу зависимостей (план спринта 12, S2.4):
          # core → render → xlsx → docx → pdf → wasm. Он же — порядок
          # публикации: в опубликованном манифесте path-деп становится
          # реестровым, и предыдущий уровень обязан существовать на crates.io.
          crates=(doc-converter-core doc-converter-render doc-converter-xlsx doc-converter-docx doc-converter-pdf doc-converter-wasm)
          for crate in "${crates[@]}"; do
            log=$(mktemp)
            if cargo package -p "$crate" --no-verify 2>&1 | tee "$log"; then
              echo "OK: $crate — упакован"
              continue
            fi
            # До первого релиза (v1.0.0) cargo при упаковке резолвит
            # path-зависимости из crates.io, где крейтов ещё нет. Это не
            # ошибка пакета, а «курица-яйцо» первого релиза (порядок держит
            # джоба publish). Строгой до публикации остаётся проверка списка
            # файлов; после первого релиза grep не срабатывает, шаг строг.
            if grep -qE "no matching package named .doc-converter-(core|render|xlsx|docx|pdf|wasm)." "$log"; then
              echo "::warning::$crate: зависимость ещё не на crates.io — ожидаемо до первого релиза; строгая проверка: cargo package --list"
              cargo package -p "$crate" --list
              continue
            fi
            cat "$log"
            echo "::error::$crate: упаковка упала"
            exit 1
          done

      # Полная симуляция публикации: упаковка + верификация сборкой
      # опубликованного манифеста. До первого релиза крейты с внутренними
      # зависимостями закономерно падают на «no matching package …» (деп ещё
      # не на crates.io) — это не регрессия упаковки, а порядок первого
      # релиза, его держит джоба publish; после первого релиза все шесть
      # имён на crates.io есть, grep перестаёт срабатывать, и шаг становится
      # строгим для любых ошибок.
      - name: cargo publish --dry-run (шесть крейтов, по зависимостям)
        run: |
          set -euo pipefail
          crates=(doc-converter-core doc-converter-render doc-converter-xlsx doc-converter-docx doc-converter-pdf doc-converter-wasm)
          for crate in "${crates[@]}"; do
            if [ "$crate" = "doc-converter-wasm" ]; then
              target_flag="--target wasm32-unknown-unknown"
            else
              target_flag=""
            fi
            log=$(mktemp)
            if cargo publish -p "$crate" --dry-run $target_flag 2>&1 | tee "$log"; then
              echo "OK: $crate — publish --dry-run зелёный"
              continue
            fi
            # Только известная пре-релизная ситуация: имя внутреннего крейта
            # ещё не существует на crates.io. Всё остальное — настоящая ошибка.
            if grep -qE "no matching package named .doc-converter-(core|render|xlsx|docx|pdf|wasm)." "$log"; then
              echo "::warning::$crate: зависимость ещё не на crates.io — ожидаемо до первого релиза (v1.0.0); верификация сборкой пропущена, упаковка проверена шагом cargo package"
              continue
            fi
            cat "$log"
            echo "::error::$crate: publish --dry-run упал"
            exit 1
          done

  publish:
    name: Publish to npmjs.org, GitHub Packages and crates.io
    # Публикация — только из тега v* или вручную из main (trunk-based).
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write # создание GitHub Release (softprops/action-gh-release)
      packages: write # публикация npm-пакетов в GitHub Packages этого репозитория
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: запасной путь заметок релиза — git log между тегами.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release

      - run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4

      # registry-url + scope + NODE_AUTH_TOKEN: setup-node кладёт в ~/.npmrc
      # и реестр, и токен (в лог он не попадает), откуда их читает `pnpm
      # publish`. Этот реестр — GitHub Packages, действующее зеркало; основной
      # реестр npmjs.org включается переменной `PUBLISH_TO_NPMJS` (ADR-0027).
      # Скоуп @meerrec обязан совпадать с владельцем (`@meerrec`) в обоих
      # реестрах, поэтому npm-шаги явно переключают `@meerrec:registry`:
      # скоуп-реестр в ~/.npmrc важнее флага `--registry`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@meerrec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # Гейт версий ДО применения changesets: `changeset version` правит
      # package.json, поэтому сверять дерево с тегом можно только до него.
      # На теге падаем при любом расхождении:
      #   * в .changeset есть нерелизнутые changesets — значит, дерево тега не
      #     релизный коммит, и `changeset version` увёл бы публикацию на
      #     версию вперёд тега;
      #   * версия npm-пакетов не совпадает с тегом;
      #   * версия крейта doc-converter-core не совпадает с тегом (версии Rust
      #     changesets не трогает вовсе, поэтому проверка отдельная).
      # Вручную (workflow_dispatch) тега нет — согласие двух реестров проверяет
      # шаг после `changeset version`.
      - name: check tag matches package version
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "doc-converter-core") | .version')
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "workflow_dispatch: тега нет, сверку с тегом пропускаем; версии npm и крейтов сверяет шаг после changeset version"
            exit 0
          fi
          # Пустой changeset (frontmatter `---\n---` без объявлений релизов)
          # не планирует публикацию: его оставляет push-гейт `changeset
          # status`, чтобы релизный коммит (версии подняты, changesets
          # применены) не был красным до появления тега. Тег-гейт такие
          # файлы не считает — иначе релизный коммит пришлось бы доводить
          # вторым коммитом-удалением с красным dry-run (прецедент v1.0.0:
          # `1a1a251` удалял хвостовой changeset отдельным коммитом).
          pending=$(grep -lE "^['\"]" .changeset/*.md 2>/dev/null | wc -l | tr -d ' ')
          if [ "$pending" -ne 0 ]; then
            echo "::error::дерево тега $GITHUB_REF_NAME содержит нерелизнутых changesets: $pending — это не релизный коммит, changeset version увёл бы публикацию вперёд тега"
            exit 1
          fi
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с версией npm-пакетов $version (packages/core/package.json)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$crate_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с версией крейта doc-converter-core $crate_version (Cargo.toml)"
            exit 1
          fi
          echo "OK: тег $GITHUB_REF_NAME совпадает с npm-пакетами и крейтом doc-converter-core ($version)"

      # Предпосылки npmjs.org проверяются ДО `changeset version`: иначе релиз
      # прошёл бы половину пути и упал на публикации из-за внешней настройки.
      # setup-node настроил `@meerrec:registry` на GitHub Packages, а скоуп-реестр
      # важнее флага `--registry` — здесь явно переключаем скоуп на npmjs.org,
      # чтобы последующий publish действительно ушёл в основной реестр.
      - name: npmjs preflight (организация @meerrec и токен)
        if: vars.PUBLISH_TO_NPMJS == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm config set @meerrec:registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          if ! npm whoami --registry=https://registry.npmjs.org/; then
            echo "::error::npmjs preflight не прошёл. Проверьте внешние предпосылки: организация @meerrec создана на npmjs.org, а секрет NPM_TOKEN — granular/automation token с правом publish в неё и обходом 2FA."
            exit 1
          fi
          echo "OK: токен npmjs.org действителен, @meerrec:registry переключён на registry.npmjs.org"

      # Версии npm-пакетов: если в .changeset есть нерелизнутые changesets —
      # применяем их (versions + CHANGELOG.md). Если их нет, версии уже
      # подняты релизным коммитом тега — берём из package.json как есть.
      # README.md в .changeset не changeset — релизными считаются остальные .md.
      # Из тега шаг не запускается вовсе: тег обязан указывать на коммит, где
      # версии уже подняты (гейт выше это проверил), иначе публикация уехала бы
      # не с той версией.
      - name: changeset version
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          # Пустые changesets (без объявлений релизов) версии не двигают —
          # их `changeset version` лишь удалил бы; считать релизными только
          # файлы с объявлениями (frontmatter со строкой `'@scope/pkg': …`).
          pending=$(grep -lE "^['\"]" .changeset/*.md 2>/dev/null | wc -l | tr -d ' ')
          if [ "$pending" -eq 0 ]; then
            echo "Нерелизнутых changesets нет — версии npm-пакетов берём из package.json тега"
            exit 0
          fi
          echo "Применяю накопленные changesets (${pending}): versions + CHANGELOG.md"
          pnpm changeset version

      # Согласие двух реестров: все десять npm-пакетов и крейт
      # doc-converter-core обязаны иметь одну версию. На теге это уже гарантировал гейт выше, а на
      # workflow_dispatch этот шаг — единственная проверка: `changeset version`
      # только что поднял npm-версии, а версии крейтов остались прежними
      # (changesets версии Rust не трогает), и без проверки в npm уехала бы
      # версия вперёд crates.io.
      - name: check npm and crate versions agree
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "doc-converter-core") | .version')
          for pkg in core wasm wasm-docx wasm-pdf cli react vue svelte wasm-pptx wasm-pptx-pdf; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$version" != "$crate_version" ]; then
              echo "::error::@meerrec/$pkg@$version не совпадает с версией крейта doc-converter-core $crate_version: в npm и crates.io уехали бы разные версии"
              exit 1
            fi
          done
          echo "OK: все десять npm-пакетов и doc-converter-core на версии $crate_version"

      - run: pnpm build:wasm

      - run: pnpm turbo run build --filter='./packages/*'

      # npmjs.org — основной реестр (ADR-0027), поэтому публикуем сюда первым:
      # GitHub Packages остаётся зеркалом и догоняет уже существующие версии.
      # setup-node указал `@meerrec:registry` на GitHub Packages, а скоуп-реестр
      # важнее флага `--registry` — поэтому скоуп переключаем явно. Шаг строгий:
      # включённый `PUBLISH_TO_NPMJS` означает, что предпосылки (организация
      # `@meerrec`, `NPM_TOKEN`) проверены preflight-шагом выше.
      - name: npm publish в registry.npmjs.org (основной реестр)
        if: vars.PUBLISH_TO_NPMJS == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm config set @meerrec:registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          publish_pkg() {
            local pkg=$1
            local version published
            version=$(node -p "require('./packages/$pkg/package.json').version")
            # Уже опубликованную версию пропускаем: повторный запуск после
            # частичного сбоя не должен падать на дубле (версию npm
            # не перезаписать). Сверяем полный список версий, а не `latest`:
            # переопубликовать старую версию всё равно нельзя, и проверка по
            # одной последней версии пропустила бы такой случай до жёсткой
            # ошибки публикации.
            published=$(npm view "@meerrec/$pkg" versions --json --registry=https://registry.npmjs.org/ 2>/dev/null || true)
            if [ -n "$published" ] &&
               printf '%s' "$published" | jq -e --arg v "$version" 'if type == "array" then . else [.] end | index($v)' >/dev/null; then
              echo "@meerrec/$pkg@$version уже в npmjs — пропускаем"
              return
            fi
            # --no-git-checks: после `changeset version` дерево грязное
            # (версии, CHANGELOG, удалённые changesets) — публикации не мешает.
            # workspace:* pnpm при упаковке заменяет на конкретные версии.
            ( cd "packages/$pkg" && pnpm publish --no-git-checks --registry=https://registry.npmjs.org/ --access public )
          }
          # Порядок — по зависимостям: сначала wasm-биндинги (их импортируют
          # core и cli), затем core и обёртки, зависящие от него, затем cli.
          publish_pkg wasm
          publish_pkg wasm-docx
          publish_pkg wasm-pdf
          publish_pkg wasm-pptx
          publish_pkg wasm-pptx-pdf
          publish_pkg core
          publish_pkg react
          publish_pkg vue
          publish_pkg svelte
          publish_pkg cli

      # GitHub Packages — действующее зеркало npmjs.org (ADR-0027). После
      # npmjs-шага `@meerrec:registry` в ~/.npmrc смотрит на registry.npmjs.org;
      # явно возвращаем скоуп на GitHub Packages, иначе публикация ушла бы не
      # в тот реестр. Право publish выдано в `permissions` джобы.
      - name: npm publish в GitHub Packages (зеркало)
        env:
          # Токен GitHub Packages; право publish выдано в `permissions` джобы.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm config set @meerrec:registry https://npm.pkg.github.com/
          publish_pkg() {
            local pkg=$1
            local version published
            version=$(node -p "require('./packages/$pkg/package.json').version")
            published=$(npm view "@meerrec/$pkg" versions --json --registry=https://npm.pkg.github.com 2>/dev/null || true)
            if [ -n "$published" ] &&
               printf '%s' "$published" | jq -e --arg v "$version" 'if type == "array" then . else [.] end | index($v)' >/dev/null; then
              echo "@meerrec/$pkg@$version уже в GitHub Packages — пропускаем"
              return
            fi
            ( cd "packages/$pkg" && pnpm publish --no-git-checks --registry=https://npm.pkg.github.com --access public )
          }
          publish_pkg wasm
          publish_pkg wasm-docx
          publish_pkg wasm-pdf
          publish_pkg wasm-pptx
          publish_pkg wasm-pptx-pdf
          publish_pkg core
          publish_pkg react
          publish_pkg vue
          publish_pkg svelte
          publish_pkg cli

      # crates.io — за отдельным выключателем: публикация в crates.io — non-goal
      # v1.x (ADR-0026), и отсутствие валидного `CARGO_REGISTRY_TOKEN` не должно
      # валить релиз уже после успешной публикации npm-пакетов. Включается
      # репозиторной переменной `PUBLISH_CRATES_IO=true`.
      - name: crates.io publish (по зависимостям)
        if: vars.PUBLISH_CRATES_IO == 'true'
        env:
          # Стандартная переменная cargo для токена реестра; --token не
          # передаём — секрет только через env.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_crate() {
            local crate=$1
            local target_flag=${2:-}
            local version published
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            # crates.io API требует User-Agent. Версию, которая уже на
            # crates.io, пропускаем: повторный запуск после частичного сбоя
            # не должен падать на дубле (версию не перезаписать, не удалить).
            # Сверяем полный список версий, а не max_version: повторная
            # публикация старой версии всё равно невозможна, и проверка по
            # одной максимальной версии пропустила бы такой случай до жёсткой
            # ошибки публикации.
            published=$(curl -fsS -A "doc-converter-release (github actions)" \
              "https://crates.io/api/v1/crates/$crate/versions" \
              | jq -r '[.versions[].num] | join(" ")' || true)
            for num in $published; do
              if [ "$num" = "$version" ]; then
                echo "$crate@$version уже на crates.io — пропускаем"
                return
              fi
            done
            # Индекс crates.io обновляется асинхронно, поэтому только что
            # опубликованная зависимость может быть ещё не видна — «no matching
            # package named doc-converter-…» на первом релизе это ожидаемая
            # гонка, а не ошибка пакета. Ждём её до пяти попыток; на любую
            # другую ошибку падаем сразу, не тратя пять минут.
            attempt=1
            while :; do
              log=$(mktemp)
              if cargo publish -p "$crate" $target_flag 2>&1 | tee "$log"; then
                echo "OK: $crate@$version опубликован"
                return
              fi
              if grep -qE "no matching package named .doc-converter-" "$log"; then
                if [ "$attempt" -ge 5 ]; then
                  cat "$log"
                  echo "::error::$crate: зависимость не появилась в индексе crates.io после 5 попыток; повторите джобу — уже опубликованные крейты пропускаются"
                  exit 1
                fi
                echo "::warning::$crate: зависимость ещё не видна в индексе crates.io (попытка $attempt/5), пауза 15 с"
                attempt=$((attempt + 1))
                sleep 15
                continue
              fi
              cat "$log"
              echo "::error::$crate: cargo publish упал"
              exit 1
            done
          }
          # Порядок — строго по графу зависимостей (план спринта 12, S2.4):
          # в опубликованном манифесте path-деп становится реестровым,
          # предыдущий уровень обязан существовать на crates.io.
          publish_crate doc-converter-core
          publish_crate doc-converter-render
          publish_crate doc-converter-xlsx
          publish_crate doc-converter-docx
          publish_crate doc-converter-pdf
          # wasm-крейт собирается только под wasm32: верификацию упаковки
          # гоняем на его родном таргете, иначе cargo собрал бы пустышку.
          publish_crate doc-converter-wasm --target wasm32-unknown-unknown

      # Заметки релиза: верхние секции CHANGELOG.md десяти пакетов (их пишет
      # `changeset version` — в этой джобе или в релизном коммите тега).
      # Секции сверяются с публикуемой версией; расхождение или отсутствие
      # CHANGELOG — признак, что версии подняты мимо changesets, тогда
      # заметки берём из git log между тегами.
      - name: release notes
        id: notes
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")

          notes_ok=1
          for pkg in core wasm wasm-docx wasm-pdf cli react vue svelte wasm-pptx wasm-pptx-pdf; do
            f="packages/$pkg/CHANGELOG.md"
            if [ ! -f "$f" ]; then
              notes_ok=0
              continue
            fi
            top=$(awk '/^## / { print substr($0, 4); exit }' "$f")
            [ "$top" = "$version" ] || notes_ok=0
          done

          : > release-notes.md
          if [ "$notes_ok" = "1" ]; then
            for pkg in core wasm wasm-docx wasm-pdf cli react vue svelte wasm-pptx wasm-pptx-pdf; do
              {
                echo "## @meerrec/$pkg"
                awk '/^## / { if (started) exit; started = 1; next } started { print }' "packages/$pkg/CHANGELOG.md"
              } >> release-notes.md
            done
          else
            echo "::warning::CHANGELOG.md пакетов отсутствуют или не совпадают с версией $version — заметки собираю из git log"
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s' "$prev..HEAD" > release-notes.md
            else
              git log --pretty=format:'- %s' > release-notes.md
            fi
          fi
          cat release-notes.md

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Релиз режем ПОСЛЕ публикаций: если публикация упадёт, в GitHub не
      # останется ссылки на несуществующие пакеты. softprops/action-gh-release
      # взят вместо actions/create-release — тот помечен как устаревший и не
      # поддерживается; у softprops есть body_path для собранных заметок.
      # По dispatch тег ещё не существует — action создаст его на HEAD.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
