<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>LOWA harness — DOCX/XLSX в PDF</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; margin: 1.5rem; max-width: 60rem; }
      h1 { font-size: 1.2rem; }
      .status { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 0.25rem; font-weight: 600; }
      .status-idle, .status-booting, .status-office-starting, .status-converting { background: #ffe9a8; }
      .status-ready, .status-done { background: #c8f0c0; }
      .status-error { background: #ffc2c2; }
      pre { background: #f4f4f4; border: 1px solid #ddd; padding: 0.6rem; overflow: auto; }
      #log { max-height: 18rem; }
      iframe { width: 100%; height: 70vh; border: 1px solid #ccc; }
      button { padding: 0.2rem 0.6rem; }
    </style>
  </head>
  <body>
    <h1>Харнесс спайка LOWA</h1>
    <p>
      Состояние: <span id="statusBox" class="status status-booting"><span id="status">idle</span></span>
    </p>
    <p>
      Документ (DOCX/XLSX): <input type="file" id="file" disabled />
      <button id="probeButton" type="button">Перечислить фильтры</button>
    </p>
    <p><a id="download" hidden>Скачать PDF</a></p>
    <pre id="log"></pre>
    <iframe id="preview" hidden title="PDF"></iframe>
    <!-- Контракт ждёт canvas: сборки LOWA с UI обращаются к нему, headless — нет. -->
    <canvas id="qtcanvas" style="display: none"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
