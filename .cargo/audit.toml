# `cargo audit` не читает `deny.toml`; раньше здесь дублировались исключения
# (RUSTSEC-2026-0187, lopdf < 0.42). С апгрейдом lopdf до 0.45 исключений нет:
# пустой `[advisories]` заставляет audit сверяться с единственным источником
# политики — deny.toml — и падать на любой новой находке без молчаливых
# пропусков.
[advisories]
