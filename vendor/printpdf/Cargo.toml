[features]
bmp = ["image/bmp"]
dds = ["image/dds"]
default = ["html"]
# Кодогенератор defaultfonts в src/font.rs требует ttf/woff2 из
# examples/assets/fonts, которых нет в вендоре; фича не входит в default.
# Включать только с положенными в vendor/printpdf/examples/assets/fonts ассетами.
example-fonts = []
gif = ["image/gif"]
hdr = ["image/hdr"]
html = [
    "kuchiki",
    "text_layout",
    "rust-fontconfig",
    "xmlparser",
]
ico = ["image/ico"]
jpeg = ["image/jpeg"]
js-sys = [
    "dep:js-sys",
    "web-sys",
    "wasm-bindgen-futures",
]
png = ["image/png"]
pnm = ["image/pnm"]
rayon = ["image/rayon"]
text_layout = [
    "azul-css",
    "azul-core",
    "azul-layout",
]
tga = ["image/tga"]
tiff = ["image/tiff"]
webp = ["image/webp"]

[target.'cfg(all(target_arch="wasm32",target_os="unknown"))'.dependencies.js-sys]
