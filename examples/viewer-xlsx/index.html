<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doc-converter: просмотр XLSX</title>
    <!-- Pages не отдаёт COOP/COEP, поэтому в проде заголовки подставляет service worker;
         в dev и preview он выходит сразу — crossOriginIsolated уже true. -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>
    <style>
      :root {
        color-scheme: light;
        --line: #d8d8d8;
        --muted: #666;
        --accent: #1a6fd4;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #fafafa;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
      label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
      select, button { font: inherit; font-size: 13px; padding: 4px 8px; }
      #viewer { position: relative; overflow: hidden; }
      #viewer.dragover { outline: 2px dashed var(--accent); outline-offset: -4px; }
      footer {
        padding: 6px 12px;
        border-top: 1px solid var(--line);
        background: #fff;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      footer b { color: #222; font-weight: 600; }
      #hint { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>doc-converter</h1>
      <input id="file" type="file" accept=".xlsx" />
      <label>
        Фикстура
        <select id="fixture"><option value="">— выберите —</option></select>
      </label>
      <label>
        Лист
        <select id="sheet" disabled></select>
      </label>
      <label>
        Зум
        <select id="zoom">
          <option value="0.5">50 %</option>
          <option value="0.75">75 %</option>
          <option value="1" selected>100 %</option>
          <option value="1.5">150 %</option>
          <option value="2">200 %</option>
        </select>
      </label>
      <label><input id="grid" type="checkbox" checked /> сетка</label>
      <label><input id="headers" type="checkbox" checked /> заголовки</label>
      <button id="export-pdf" type="button" disabled>Экспорт в PDF</button>
      <button id="export-book-pdf" type="button" disabled>Экспорт книги</button>
      <span id="hint">перетащите .xlsx в окно</span>
    </header>

    <main id="viewer"></main>

    <footer>
      <span>ячейка: <b id="cell">—</b></span>
      <span>команд: <b id="cmds">0</b></span>
      <span>сборка: <b id="build">—</b></span>
      <span>рисование: <b id="paint">—</b></span>
      <span>кадр: <b id="frame">0</b></span>
      <span id="status"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
